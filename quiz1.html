<script>
const quizData = [
    // Your 50 questions go here exactly as you already have them
];

const questionEl = document.getElementById("question");
const questionNumEl = document.getElementById("question-num");
const optionsContainer = document.getElementById("options-container");
const nextBtn = document.getElementById("next-btn");
const quizBox = document.getElementById("quiz-box");
const resultBox = document.getElementById("result-box");
const scoreDisplay = document.getElementById("score-display");

let currentQuestionIndex = 0;
let score = 0;

function startQuiz() {
    currentQuestionIndex = 0;
    score = 0;

    quizBox.style.display = "block";
    resultBox.style.display = "none";
    nextBtn.style.display = "none";

    showQuestion();
}

function showQuestion() {
    nextBtn.style.display = "none";
    optionsContainer.innerHTML = "";

    const currentQuestion = quizData[currentQuestionIndex];

    questionNumEl.innerText =
        `Question ${currentQuestionIndex + 1} of ${quizData.length}`;

    questionEl.innerText = currentQuestion.question;

    currentQuestion.answers.forEach((answer, index) => {
        const button = document.createElement("button");

        button.innerText = answer;
        button.classList.add("btn");

        button.addEventListener("click", () => {
            selectAnswer(index);
        });

        optionsContainer.appendChild(button);
    });
}

function selectAnswer(selectedIndex) {
    const currentQuestion = quizData[currentQuestionIndex];

    if (selectedIndex === currentQuestion.correct) {
        score++;
    }

    const buttons = optionsContainer.getElementsByClassName("btn");

    for (let button of buttons) {
        button.disabled = true;
        button.style.cursor = "default";
    }

    if (selectedIndex === currentQuestion.correct) {
        buttons[selectedIndex].style.background = "#4CAF50";
        buttons[selectedIndex].style.color = "white";
    } else {
        buttons[selectedIndex].style.background = "#f44336";
        buttons[selectedIndex].style.color = "white";

        buttons[currentQuestion.correct].style.background = "#4CAF50";
        buttons[currentQuestion.correct].style.color = "white";
    }

    nextBtn.style.display = "block";
}

nextBtn.addEventListener("click", () => {
    currentQuestionIndex++;

    if (currentQuestionIndex < quizData.length) {
        showQuestion();
    } else {
        showResults();
    }
});

function showResults() {
    quizBox.style.display = "none";
    resultBox.style.display = "block";

    scoreDisplay.innerText =
        `Quiz Complete! You scored ${score} out of ${quizData.length}!`;
}

function restartQuiz() {
    startQuiz();
}

startQuiz();
</script>
