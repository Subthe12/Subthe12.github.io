<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub's Math Quiz</title>

    <style>
        body {
            background-color: #d5dfed;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header1 {
            color: white;
            background-color: #B2AC88;
            border-radius: 30px;
            text-align: center;
            padding: 20px;
            margin: 20px;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex: 1;
            padding: 20px;
        }

        .quiz-container {
            background-color: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .timer-box {
            background-color: #ffeb3b;
            color: #333;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 16px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px 0;
        }

        .btn {
            background-color: #e7e7e7;
            color: #333;
            border: 2px solid transparent;
            padding: 14px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .btn:hover:not(:disabled) {
            background-color: #d4d4d4;
        }

        .btn.selected {
            background-color: #2196F3;
            color: white;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #back-btn { background-color: #757575; color: white; }
        #skip-btn { background-color: #ff9800; color: white; }
        #next-btn { background-color: #B2AC88; color: white; }

        .score-card { text-align: center; }
        .score-text {
            font-size: 26px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .stats-container {
            display: flex;
            justify-content: space-around;
            margin: 25px 0;
        }

        .stat-box {
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
        }

        .correct-box { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .wrong-box { background-color: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        .skipped-box { background-color: #fff3e0; color: #ef6c00; border: 1px solid #ffe0b2; }

        footer {
            background-color: #060b14;
            color: white;
            width: 100%;
            padding: 20px 0;
            text-align: center;
            margin-top: auto;
        }

        footer a { color: white; }
    </style>
</head>

<body>

<div class="header1">
    <h1> Mathematics Quiz</h1>
    <nav>
        <a href="math.html" style="text-decoration: underline;">Math Quiz</a> | 
        <a href="geography.html">Geography Quiz</a>
    </nav>
</div>

<main>
    <div class="quiz-container">

        <div id="quiz-box">
            <div class="quiz-header">
                <h3 id="question-num" style="color:#666;font-size:18px;margin:0;">
                    Question 1 of 10
                </h3>
                <div class="timer-box" id="timer">Time Left: 15s</div>
            </div>

            <h2 id="question" style="margin-top:10px;color:#333;">
                Question text goes here
            </h2>

            <div id="options-container" class="options"></div>

            <div class="nav-buttons">
                <button id="back-btn" class="action-btn">Back</button>
                <button id="skip-btn" class="action-btn">Skip</button>
                <button id="next-btn" class="action-btn">Next</button>
            </div>
        </div>

        <div id="result-box" style="display:none;">
            <div class="score-card">
                <div class="score-text" id="score-display"></div>
                
                <div class="stats-container">
                    <div class="stat-box correct-box">
                        Correct: <span id="correct-count">0</span>
                    </div>
                    <div class="stat-box wrong-box">
                        Wrong: <span id="wrong-count">0</span>
                    </div>
                    <div class="stat-box skipped-box">
                        Skipped: <span id="skipped-count">0</span>
                    </div>
                </div>

                <button 
                    class="btn" 
                    style="width:100%;text-align:center;background:#B2AC88;color:white;font-weight:bold;" 
                    onclick="restartQuiz()">
                    Restart Quiz
                </button>
            </div>
        </div>

    </div>
</main>

<footer>
    <p>&copy; 2026 Sub's Math Quiz. All rights reserved.</p>
</footer>

<script>
const quizData = [
    { question: "What is the square root of 144?", answers: ["10", "12", "14", "16"], correct: 1 },
    { question: "Solve for x: 2x + 5 = 15", answers: ["x = 3", "x = 5", "x = 10", "x = 4"], correct: 1 },
    { question: "What is the area of a rectangle with length 8 cm and width 5 cm?", answers: ["13 cm²", "40 cm²", "26 cm²", "35 cm²"], correct: 1 },
    { question: "What is 15% of 200?", answers: ["20", "25", "30", "35"], correct: 2 },
    { question: "What is the value of 3³ (3 to the power of 3)?", answers: ["9", "27", "81", "18"], correct: 1 },
    { question: "What is the perimeter of a square with a side length of 6 cm?", answers: ["12 cm", "24 cm", "36 cm", "18 cm"], correct: 1 },
    { question: "What is the value of 7 × 8?", answers: ["48", "54", "56", "64"], correct: 2 },
    { question: "What is the smallest prime number?", answers: ["0", "1", "2", "3"], correct: 2 },
    { question: "If a triangle has angles 60° and 30°, what is the third angle?", answers: ["90°", "60°", "45°", "100°"], correct: 0 },
    { question: "What is 100 divided by 4?", answers: ["20", "25", "30", "50"], correct: 1 }
];

const questionEl = document.getElementById("question");
const questionNumEl = document.getElementById("question-num");
const optionsContainer = document.getElementById("options-container");
const timerEl = document.getElementById("timer");

const backBtn = document.getElementById("back-btn");
const skipBtn = document.getElementById("skip-btn");
const nextBtn = document.getElementById("next-btn");

const quizBox = document.getElementById("quiz-box");
const resultBox = document.getElementById("result-box");
const scoreDisplay = document.getElementById("score-display");
const correctCountEl = document.getElementById("correct-count");
const wrongCountEl = document.getElementById("wrong-count");
const skippedCountEl = document.getElementById("skipped-count");

let currentQuestionIndex = 0;
let userAnswers = new Array(quizData.length).fill(null); 

const QUESTION_TIME_LIMIT = 15;
let timeLeft = QUESTION_TIME_LIMIT;
let timerInterval = null;

function startQuiz() {
    currentQuestionIndex = 0;
    userAnswers = new Array(quizData.length).fill(null);
    quizBox.style.display = "block";
    resultBox.style.display = "none";
    showQuestion();
}

function startTimer() {
    clearInterval(timerInterval);
    timeLeft = QUESTION_TIME_LIMIT;
    timerEl.innerText = `Time Left: ${timeLeft}s`;

    timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.innerText = `Time Left: ${timeLeft}s`;

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            navigateNext();
        }
    }, 1000);
}

function showQuestion() {
    startTimer();
    optionsContainer.innerHTML = "";
    const currentQuestion = quizData[currentQuestionIndex];

    questionNumEl.innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
    questionEl.innerText = currentQuestion.question;
    backBtn.disabled = currentQuestionIndex === 0;

    currentQuestion.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.innerText = answer;
        button.classList.add("btn");

        if (userAnswers[currentQuestionIndex] === index) {
            button.classList.add("selected");
        }

        button.addEventListener("click", () => {
            selectAnswer(index);
        });

        optionsContainer.appendChild(button);
    });
}

function selectAnswer(selectedIndex) {
    userAnswers[currentQuestionIndex] = selectedIndex;
    const buttons = optionsContainer.getElementsByClassName("btn");
    for (let button of buttons) {
        button.classList.remove("selected");
    }
    buttons[selectedIndex].classList.add("selected");
}

function navigateNext() {
    clearInterval(timerInterval);
    currentQuestionIndex++;

    if (currentQuestionIndex < quizData.length) {
        showQuestion();
    } else {
        showResults();
    }
}

nextBtn.addEventListener("click", () => navigateNext());
skipBtn.addEventListener("click", () => {
    userAnswers[currentQuestionIndex] = null;
    navigateNext();
});
backBtn.addEventListener("click", () => {
    if (currentQuestionIndex > 0) {
        clearInterval(timerInterval);
        currentQuestionIndex--;
        showQuestion();
    }
});

function showResults() {
    clearInterval(timerInterval);
    quizBox.style.display = "none";
    resultBox.style.display = "block";

    let correctCount = 0;
    let wrongCount = 0;
    let skippedCount = 0;

    userAnswers.forEach((answer, idx) => {
        if (answer === null) skippedCount++;
        else if (answer === quizData[idx].correct) correctCount++;
        else wrongCount++;
    });

    const totalQuestions = quizData.length;
    const percentage = ((correctCount / totalQuestions) * 100).toFixed(1);

    scoreDisplay.innerText = `Quiz Complete! You scored ${percentage}%`;
    correctCountEl.innerText = correctCount;
    wrongCountEl.innerText = wrongCount;
    skippedCountEl.innerText = skippedCount;
}

function restartQuiz() {
    startQuiz();
}

startQuiz();
</script>

</body>
</html>
