<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple JavaScript Quiz</title>
    <style>
        /* CSS for Layout and Styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .quiz-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }
        .btn {
            background-color: #e7e7e7;
            color: #333;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #d4d4d4;
        }
        #next-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            display: none; /* Hidden until an option is selected */
        }
        #next-btn:hover {
            background-color: #0056b3;
        }
        .score-text {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <!-- Quiz Stage -->
        <div id="quiz-box">
            <h2 id="question">Question text goes here</h2>
            <div id="options-container" class="options"></div>
            <button id="next-btn">Next Question</button>
        </div>
        
        <!-- Results Stage -->
        <div id="result-box" style="display: none;">
            <p class="score-text" id="score-display"></p>
            <button class="btn" style="width:100%; text-align:center; background:#28a745; color:white;" onclick="restartQuiz()">Restart Quiz</button>
        </div>
    </div>

    <script>
        // JavaScript for Quiz Logic
        const quizData = [
            {
                question: "What does HTML stand for?",
                answers: ["Hyper Text Markup Language", "High Text Markdown Language", "Hyper Loop Machine Language", "None of the above"],
                correct: 0
            },
            {
                question: "Which language runs in a web browser?",
                answers: ["Java", "C", "Python", "JavaScript"],
                correct: 3
            },
            {
                question: "What year was JavaScript launched?",
                answers: ["1996", "1995", "1994", "2000"],
                correct: 1
            }
        ];

        const questionEl = document.getElementById("question");
        const optionsContainer = document.getElementById("options-container");
        const nextBtn = document.getElementById("next-btn");
        const quizBox = document.getElementById("quiz-box");
        const resultBox = document.getElementById("result-box");
        const scoreDisplay = document.getElementById("score-display");

        let currentQuestionIndex = 0;
        let score = 0;

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            quizBox.style.display = "block";
            resultBox.style.display = "none";
            nextBtn.style.display = "none";
            showQuestion();
        }

        function showQuestion() {
            nextBtn.style.display = "none";
            optionsContainer.innerHTML = "";
            
            let currentQuestion = quizData[currentQuestionIndex];
            questionEl.innerText = currentQuestion.question;

            // Generate option buttons dynamically
            currentQuestion.answers.forEach((answer, index) => {
                const button = document.createElement("button");
                button.innerText = answer;
                button.classList.add("btn");
                button.addEventListener("click", () => selectAnswer(index));
                optionsContainer.appendChild(button);
            });
        }

        function selectAnswer(selectedIndex) {
            let currentQuestion = quizData[currentQuestionIndex];
            
            // Check if selected answer matches correct answer index
            if (selectedIndex === currentQuestion.correct) {
                score++;
            }

            // Highlight the buttons (Optional: disabled for multiple clicks)
            const buttons = optionsContainer.getElementsByClassName("btn");
            for (let button of buttons) {
                button.disabled = true;
            }

            // Reveal the Next Button
            nextBtn.style.display = "block";
        }

        nextBtn.addEventListener("click", () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                showQuestion();
            } else {
                showResults();
            }
        });

        function showResults() {
            quizBox.style.display = "none";
            resultBox.style.display = "block";
            scoreDisplay.innerText = `You scored ${score} out of ${quizData.length}!`;
        }

        function restartQuiz() {
            startQuiz();
        }

        // Initialize the app
        startQuiz();
    </script>
</body>
</html>
