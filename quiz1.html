<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub's Math Quiz Page</title>

    <style>
        body {
            background-color: #d5dfed;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header1 {
            color: white;
            background-color: #B2AC88;
            border-radius: 30px;
            text-align: center;
            padding: 20px;
            margin: 20px;
        }

        main {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex: 1;
            padding: 20px;
        }

        .quiz-container {
            background-color: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px 0;
        }

        .btn {
            background-color: #e7e7e7;
            color: #333;
            border: 2px solid transparent;
            padding: 14px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .btn:hover:not(:disabled) {
            background-color: #d4d4d4;
        }

        /* Selected state during quiz (neutral blue highlight) */
        .btn.selected {
            background-color: #2196F3;
            color: white;
        }

        #next-btn {
            background-color: #B2AC88;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }

        #next-btn:hover {
            opacity: 0.9;
        }

        .score-card {
            text-align: center;
        }

        .score-text {
            font-size: 26px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .stats-container {
            display: flex;
            justify-content: space-around;
            margin: 25px 0;
        }

        .stat-box {
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
        }

        .correct-box {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .wrong-box {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        footer {
            background-color: #060b14;
            color: white;
            width: 100%;
            padding: 20px 0;
            text-align: center;
            margin-top: auto;
        }

        footer a {
            color: white;
        }
    </style>
</head>

<body>

<div class="header1">
    <h1>Mathematics Quiz</h1>
</div>

<main>
    <div class="quiz-container">

        <div id="quiz-box">
            <h3 id="question-num" style="color:#666;font-size:18px;margin:0;">
                Question 1 of 50
            </h3>

            <h2 id="question" style="margin-top:10px;color:#333;">
                Question text goes here
            </h2>

            <div id="options-container" class="options"></div>

            <button id="next-btn">Next Question</button>
        </div>

        <div id="result-box" style="display:none;">
            <div class="score-card">
                <div class="score-text" id="score-display"></div>
                
                <div class="stats-container">
                    <div class="stat-box correct-box">
                        Correct: <span id="correct-count">0</span>
                    </div>
                    <div class="stat-box wrong-box">
                        Wrong: <span id="wrong-count">0</span>
                    </div>
                </div>

                <button 
                    class="btn" 
                    style="width:100%;text-align:center;background:#B2AC88;color:white;font-weight:bold;" 
                    onclick="restartQuiz()">
                    Restart Quiz
                </button>
            </div>
        </div>

    </div>
</main>

<footer>
    <p>&copy; 2026 Sub's Math Quiz. All rights reserved.</p>
</footer>

const questionEl = document.getElementById("question");
const questionNumEl = document.getElementById("question-num");
const optionsContainer = document.getElementById("options-container");
const nextBtn = document.getElementById("next-btn");
const quizBox = document.getElementById("quiz-box");
const resultBox = document.getElementById("result-box");
const scoreDisplay = document.getElementById("score-display");
const correctCountEl = document.getElementById("correct-count");
const wrongCountEl = document.getElementById("wrong-count");

let currentQuestionIndex = 0;
let score = 0;
let selectedAnswerIndex = null;

function startQuiz() {
    currentQuestionIndex = 0;
    score = 0;

    quizBox.style.display = "block";
    resultBox.style.display = "none";

    showQuestion();
}

function showQuestion() {
    selectedAnswerIndex = null;
    nextBtn.style.display = "none";
    optionsContainer.innerHTML = "";

    const currentQuestion = quizData[currentQuestionIndex];

    questionNumEl.innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
    questionEl.innerText = currentQuestion.question;

    currentQuestion.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.innerText = answer;
        button.classList.add("btn");

        button.addEventListener("click", () => {
            selectAnswer(index);
        });

        optionsContainer.appendChild(button);
    });
}

function selectAnswer(selectedIndex) {
    selectedAnswerIndex = selectedIndex;

    const buttons = optionsContainer.getElementsByClassName("btn");

    // Clear previous selection styling
    for (let button of buttons) {
        button.classList.remove("selected");
    }

    // Mark current selection neutrally
    buttons[selectedIndex].classList.add("selected");
    
    // Show Next Question button
    nextBtn.style.display = "block";
}

nextBtn.addEventListener("click", () => {
    const currentQuestion = quizData[currentQuestionIndex];

    // Evaluate score silently
    if (selectedAnswerIndex === currentQuestion.correct) {
        score++;
    }

    currentQuestionIndex++;

    if (currentQuestionIndex < quizData.length) {
        showQuestion();
    } else {
        showResults();
    }
});

function showResults() {
    quizBox.style.display = "none";
    resultBox.style.display = "block";

    const totalQuestions = quizData.length;
    const wrongAnswers = totalQuestions - score;
    const percentage = ((score / totalQuestions) * 100).toFixed(1);

    scoreDisplay.innerText = `Quiz Complete! You scored ${percentage}%`;
    correctCountEl.innerText = score;
    wrongCountEl.innerText = wrongAnswers;
}

function restartQuiz() {
    startQuiz();
}

startQuiz();
</script>

</html>
