<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Comments</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #d5dfed;
      padding: 40px;
    }
    .comment-box {
      background: white;
      max-width: 600px;
      margin: 0 auto 30px auto;
      padding: 30px;
      border-radius: 20px;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0 20px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    button {
      background-color: #B2AC88;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #999373;
    }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #060b14;
    }
    /* New styles for displaying comments */
    .comments-display-box {
      background: white;
      max-width: 600px;
      margin: 0 auto;
      padding: 30px;
      border-radius: 20px;
    }
    .comment-item {
      border-bottom: 1px solid #eee;
      padding: 15px 0;
    }
    .comment-item:last-child {
      border-bottom: none;
    }
    .comment-name {
      font-weight: bold;
      color: #060b14;
      margin-bottom: 5px;
    }
    .comment-text {
      color: #555;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="comment-box">
    <h2>Leave a Comment</h2>
    <!-- Removed action and method to prevent the 405 server error -->
    <form id="commentForm">
      <label for="name">Name:</label>
      <input type="text" id="name" required placeholder="Your name...">

      <label for="msg">Message:</label>
      <textarea id="msg" rows="5" required placeholder="Type your comment here..."></textarea>

      <button type="submit">Post Comment</button>
    </form>
    
    <a class="back-link" href="index.html">← Back to Summary</a>
  </div>

  <!-- New section where comments will visibly appear -->
  <div class="comments-display-box">
    <h2>All Comments</h2>
    <div id="commentsList"></div>
  </div>

  <script>
    const commentForm = document.getElementById('commentForm');
    const commentsList = document.getElementById('commentsList');

    // Function to load and display saved comments from browser memory
    function displayComments() {
      commentsList.innerHTML = '';
      const savedComments = JSON.parse(localStorage.getItem('myWebComments')) || [];
      
      if (savedComments.length === 0) {
        commentsList.innerHTML = '<p style="color: #888;">No comments yet. Be the first!</p>';
        return;
      }

      savedComments.forEach(comment => {
        const item = document.createElement('div');
        item.className = 'comment-item';
        item.innerHTML = `
          <div class="comment-name">${escapeHTML(comment.name)}</div>
          <p class="comment-text">${escapeHTML(comment.message)}</p>
        `;
        commentsList.appendChild(item);
      });
    }

    // Function to handle form submission without page reload
    commentForm.addEventListener('submit', function(event) {
      event.preventDefault(); // Prevents the 405 error page reload

      const nameInput = document.getElementById('name');
      const msgInput = document.getElementById('msg');

      const newComment = {
        name: nameInput.value,
        message: msgInput.value
      };

      // Get existing comments, add new one, and save back to local storage
      const savedComments = JSON.parse(localStorage.getItem('myWebComments')) || [];
      savedComments.push(newComment);
      localStorage.setItem('myWebComments', JSON.stringify(savedComments));

      // Reset form and refresh display list
      nameInput.value = '';
      msgInput.value = '';
      displayComments();
    });

    // Helper to prevent malicious code injections (XSS)
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Run display setup on page load
    displayComments();
  </script>

</body>
</html>
