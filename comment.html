<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Comments</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #d5dfed;
      padding: 40px;
    }
    .comment-box {
      background: white;
      max-width: 600px;
      margin: 0 auto;
      padding: 30px;
      border-radius: 20px;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0 20px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    button {
      background-color: #B2AC88;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #999373;
    }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #060b14;
    }
  </style>
</head>
<body>

  <div class="comment-box">
    <h2>Leave a Comment</h2>
    <!-- The action attribute connects to your server script later -->
    <form action="/submit-comment" method="POST">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required placeholder="Your name...">

      <label for="msg">Message:</label>
      <textarea id="msg" name="message" rows="5" required placeholder="Type your comment here..."></textarea>

      <button type="submit">Post Comment</button>
    </form>
    
    <a class="back-link" href="index.html">← Back to Summary</a>
  </div>

</body>
</html>
