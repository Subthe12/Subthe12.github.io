<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Comments</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #d5dfed;
      padding: 40px;
    }
    .comment-box {
      background: white;
      max-width: 600px;
      margin: 0 auto 30px auto;
      padding: 30px;
      border-radius: 20px;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0 20px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    button {
      background-color: #B2AC88;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #999373;
    }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #060b14;
    }
    .comments-display-box {
      background: white;
      max-width: 600px;
      margin: 0 auto;
      padding: 30px;
      border-radius: 20px;
    }
    .comment-item {
      border-bottom: 1px solid #eee;
      padding: 15px 0;
    }
    .comment-item:last-child {
      border-bottom: none;
    }
    .comment-name {
      font-weight: bold;
      color: #060b14;
      margin-bottom: 3px;
    }
    .comment-time {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
    }
    .comment-text {
      color: #555;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="comment-box">
    <h2>Leave a Comment</h2>
    <form id="commentForm">
      <label for="name">Name:</label>
      <input type="text" id="name" required placeholder="Your name...">

      <label for="msg">Message:</label>
      <textarea id="msg" rows="5" required placeholder="Type your comment here..."></textarea>

      <button type="submit">Post Comment</button>
    </form>
    
    <a class="back-link" href="index.html">← Back to Summary</a>
  </div>

  <div class="comments-display-box">
    <h2>All Global Comments</h2>
    <div id="commentsList"></div>
  </div>

  <!-- Include Compatible Firebase Scripts -->
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>

  <script>
    // Configured precisely with your sub-comment credentials
    const firebaseConfig = {
      apiKey: "AIzaSyAV13oZmai424v3aQ5JIcp4IAjfLN4OoBo",
      authDomain: "sub-comment.firebaseapp.com",
      databaseURL: "https://firebaseio.com", // Points to your Realtime Database region
      projectId: "sub-comment",
      storageBucket: "sub-comment.firebasestorage.app",
      messagingSenderId: "460765119345",
      appId: "1:460765119345:web:0ab9154bde74709f41acd0"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const commentForm = document.getElementById('commentForm');
    const commentsList = document.getElementById('commentsList');

    // Live reader from your cloud database
    database.ref('comments').on('value', (snapshot) => {
      commentsList.innerHTML = '';
      const data = snapshot.val();
      
      if (!data) {
        commentsList.innerHTML = '<p style="color: #888;">No comments yet. Be the first to leave one global note!</p>';
        return;
      }

      Object.values(data).forEach(comment => {
        const item = document.createElement('div');
        item.className = 'comment-item';
        item.innerHTML = `
          <div class="comment-name">${escapeHTML(comment.name)}</div>
          <div class="comment-time">${comment.time}</div>
          <p class="comment-text">${escapeHTML(comment.message)}</p>
        `;
        commentsList.appendChild(item);
      });
    });

    // Pushes your input entries up into the global Firebase cloud storage bucket
    commentForm.addEventListener('submit', function(event) {
      event.preventDefault(); 

      const nameInput = document.getElementById('name');
      const msgInput = document.getElementById('msg');
      const currentDateTime = new Date().toLocaleString();

      database.ref('comments').push({
        name: nameInput.value,
        message: msgInput.value,
        time: currentDateTime
      });

      nameInput.value = '';
      msgInput.value = '';
    });

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>

</body>
</html>
