<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Football</title>

    <!-- Google Fonts Imports -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">

    <style>
        html {
            scroll-behavior: smooth;
        }

         h2, h3, h4, h5 {
            font-family: 'Bodoni Moda', serif;
        }

        body {
            font-size: 20px;
            line-height: 1.6;
            /* FIXED: Use a valid image path and hyphens for no-repeat */
            background-image: url('fusball_html.jfif');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        header {
            color: white;
            background-color: #B2AC88;
            border-radius: 30px;
            padding: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        main {
            display: flex;
            background-color: rgba(255, 255, 255, 0.3); /* Slightly transparent to show background */
            border-radius: 30px;
            justify-content: space-around; 
            padding: 20px;
            gap: 20px;
            margin-bottom: 30px;
            font-family: 'Lato', sans-serif;
        }

        #a1, #a2 {
            background-color: #fae5d2;
            padding: 20px;
            border-radius: 20px;
            flex: 1; 
        }

        .ctext {
            text-decoration: none;
            color: #2c3e50;
            display: inline-block;
            margin-bottom: 8px;
        }

        .ctext:hover {
            text-decoration: underline;
        }

        .dt {
            font-weight: bold;
            font-family: "Times New Roman", serif;
            background-color: #ffffff;
            font-size: 28px;
            padding: 5px 10px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 20px;
        }

        dd {
            margin: 10px 0 20px 20px;
        }
        h1 {
            font-size:40px;
            font-family: 'Bodoni Moda', serif;
        }
    </style>
    <link rel="icon" type="image/x-icon" href="favicon.jpg">
</head>

<body>
 <h1 align="Center">
          Football
</h1> 
</body>
</html>
