
<!DOCTYPE html>
<html>
<head>
    <title>Geography Main Page</title>
    <style>
        html {
            scroll-behavior: smooth;
        }
        h1, h2, h3, h4, h5{
            font-family: 'Bodoni Moda', sans-serif;
        }
        
        

        body {
            background-color: #d5dfed;
            font-size: 20px; /* Adjusted slightly for better balance */
            margin: 20px;
            line-height: 1.6;
        }

        header {
            color: white;
            background-color: #B2AC88;
            border-radius: 30px;
            padding: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-family: 'Bodoni Moda', sans-serif;
        }

        main {
            display: flex;
            background-color: rgb(255, 255, 255);
            border-radius: 30px;
            justify-content: space-around; 
            padding: 20px;
            gap: 20px;
            margin-bottom: 30px;
            font-family: 'Lato', sans-serif;
        }

        #a1, #a2 {
            background-color: #fae5d2;
            padding: 20px;
            border-radius: 20px;
            flex: 1; 
        }

        .ctext {
            text-decoration: none;
            color: #2c3e50;
            display: inline-block;
            margin-bottom: 8px;
        }

        .ctext:hover {
            text-decoration: underline;
        }

        .dt {
            font-weight: bold;
            font-family: "Times New Roman", serif;
            background-color: #ffffff;
            font-size: 28px;
            padding: 5px 10px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 20px;
        }

        dd {
            margin: 10px 0 20px 20px;
        }
    </style>
    <link rel="icon" type="image/x-icon" href="favicon.jpg">
</head>

<body>

    <header>
        <h1>Geography Summary</h1>
    </header>

</body>
</html>
